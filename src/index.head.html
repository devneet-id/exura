<!-- dark by default (or the saved choice) before the page paints; exuracss reversal works on <html> too -->
<script>
  (function () {
    var mode = null;
    try { mode = localStorage.getItem('exura-mode'); } catch (e) {}
    if (!mode) mode = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    if (mode === 'dark') document.documentElement.setAttribute('dark', '');
  })();
</script>
